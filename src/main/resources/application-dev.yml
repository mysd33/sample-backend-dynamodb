server:
  port: 8000
# Tomcat metrics enabled
# Spring Cloud for AWS Micrometer CloudWatch Metrics Integration Enabled if local testing is required
#  tomcat:
#    mbeanregistry:
#      enabled: true
spring:
  # Spring Security Basic Authentication
  security:
    user:
      name: ${BACKEND_BASIC_AUTH_USERNAME:user}
      password: ${BACKEND_BASIC_AUTH_PASSWORD:password}

# Spring docs enabled  for local development
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    os:
      enabled: true
    java:
      enabled: true
#  endpoint:
#    env:
#      show-values: always
# Spring Cloud for AWS Micrometer CloudWatch Metrics Integration Enabled if local testing is required
#  cloudwatch:
#    metrics:
#      export:
#        enabled: true

logging:
  level:
    org.springframework: INFO
    org.springframework.jdbc: INFO
    #    org.springframework.security: TRACE
    #    org.springframework.security.oauth2: TRACE
    com.example: DEBUG
    com.example.fw.web.aspect.LogAspect: TRACE
#    software.amazon.awssdk: DEBUG
# 拡張フレームワーク機能の設定
example:
# DynamoDB Local
  dynamodb:
    dynamodblocal:
      port: 18000
