server:
  tomcat:
    # Tomcat metrics enabled for Spring Cloud for AWS Micrometer CloudWatch Metrics Integration
    mbeanregistry:
      enabled: true

spring:
  security:
    user:
      name: ${example.api.backend.basic-auth.username}
      password: ${example.api.backend.basic-auth.password}
    oauth2:
      resourceserver:
        jwt:
          # audクレームの検証を行う場合の設定（audiencesの値は、KeycloakのクライアントIDと一致させる必要）
          audiences:
            - ${spring.security.oauth2.resourceserver.opaquetoken.client-id}

  # Spring Cloud for AWS Parameter Store Integration & Secrets Manager Integration Enabled
  cloud:
    aws:
      parameterstore:
        enabled: true
      secretsmanager:
        enabled: true
  config:
    import:
      - optional:aws-parameterstore:/config/${PROJECT_NAME}/${ENV_NAME}/common/;/config/${PROJECT_NAME}/${ENV_NAME}/${spring.application.name}/
      - optional:aws-secretsmanager:${BASIC_AUTH_SECRETS_NAME}?prefix=example.api.backend.basic-auth.
      - optional:aws-secretsmanager:${KEYCLOAK_SECRETS_NAME}?prefix=spring.security.oauth2.resourceserver.opaquetoken.

# Spring Boot Actuator
management:
  endpoints:
    web:
      discovery:
        enabled: false
  # Metrics enabled
  metrics:
    enable:
      all: false
      system: true
      process: true
      disk: true
      jvm: true
      tomcat: true
  # Spring Cloud for AWS Micrometer CloudWatch Metrics Integration Enabled
  cloudwatch:
    metrics:
      export:
        enabled: true
        namespace: ${spring.application.name}

# 拡張フレームワーク機能の設定
example:
  oauth2:
    # OIDC/OAuth認証機能の有効化
    enabled: true
    resourceserver:
      opaque-token:
        enabled: true
